// SYLION AEIS -- Class H: AEIS Self (5 modules)
// Version: 1.0.0 (Contract Freeze)
//
// Modules: SelfObservation, ImprovementQueue, SelfExplanation,
//          SelfLimitation, SelfPreservation

syntax = "proto3";

package sylion.aeis.v1;

import "common.proto";

option go_package = "github.com/sylion/aeis/api/aeis/v1;aeisv1";
option java_package = "com.sylion.aeis.aeis.v1";

// =====================================================================
// H1: Self Observation Service
// =====================================================================

service SelfObservationService {
  rpc Record(RecordObservationRequest) returns (ObservationMessage);
  rpc GetObservations(GetObservationsRequest) returns (ObservationList);
  rpc GetAggregate(GetAggregateRequest) returns (AggregateMessage);
  rpc GetDashboard(sylion.common.v1.Empty) returns (DashboardMessage);
  rpc GetStats(sylion.common.v1.Empty) returns (ObservationStats);
}

message RecordObservationRequest {
  string metric     = 1;
  double value      = 2;
  string unit       = 3;
  string source     = 4;
  string tags_json  = 5;
}

message ObservationMessage {
  string observation_id = 1;
  string metric         = 2;
  double value          = 3;
  string unit           = 4;
  string source         = 5;
  double timestamp      = 6;
}

message GetObservationsRequest {
  string metric  = 1;
  string source  = 2;
  int32  limit   = 3;
}

message ObservationList {
  repeated ObservationMessage observations = 1;
}

message GetAggregateRequest {
  string metric    = 1;
  string aggregate = 2;  // avg|sum|min|max|count
  double since     = 3;
}

message AggregateMessage {
  string metric    = 1;
  double value     = 2;
  string aggregate = 3;
  int32  count     = 4;
}

message DashboardMessage {
  map<string, double> gauges = 1;
  int32 total_observations   = 2;
}

message ObservationStats {
  int32  total_observations = 1;
  int32  unique_metrics     = 2;
  double latest_timestamp   = 3;
}

// =====================================================================
// H2: Improvement Queue Service
// =====================================================================

service ImprovementQueueService {
  rpc Submit(SubmitImprovementRequest) returns (ImprovementMessage);
  rpc GetNext(sylion.common.v1.Empty) returns (ImprovementMessage);
  rpc Start(ImprovementIdRequest) returns (sylion.common.v1.Status);
  rpc Complete(ImprovementIdRequest) returns (sylion.common.v1.Status);
  rpc Reject(RejectImprovementRequest) returns (sylion.common.v1.Status);
  rpc ListImprovements(ListImprovementsRequest) returns (ImprovementList);
  rpc GetStats(sylion.common.v1.Empty) returns (ImprovementStats);
}

message SubmitImprovementRequest {
  string title       = 1;
  string description = 2;
  string category    = 3;
  int32  priority    = 4;
  string proposed_by = 5;
}

message ImprovementMessage {
  string improvement_id = 1;
  string title          = 2;
  string description    = 3;
  string category       = 4;
  int32  priority       = 5;
  string status         = 6;
  string proposed_by    = 7;
  double created_at     = 8;
}

message ImprovementIdRequest {
  string improvement_id = 1;
}

message RejectImprovementRequest {
  string improvement_id = 1;
  string reason         = 2;
}

message ListImprovementsRequest {
  string status   = 1;
  string category = 2;
}

message ImprovementList {
  repeated ImprovementMessage improvements = 1;
}

message ImprovementStats {
  int32 total     = 1;
  int32 pending   = 2;
  int32 completed = 3;
  int32 rejected  = 4;
}

// =====================================================================
// H3: Self Explanation Service
// =====================================================================

service SelfExplanationService {
  rpc Generate(GenerateExplanationRequest) returns (ExplanationMessage);
  rpc Validate(ValidateExplanationRequest) returns (ExplanationValidationMessage);
  rpc GetExplanation(GetExplanationRequest) returns (ExplanationMessage);
  rpc ListExplanations(ListExplanationsRequest) returns (ExplanationList);
  rpc GetStats(sylion.common.v1.Empty) returns (ExplanationStats);
}

message GenerateExplanationRequest {
  string action_id      = 1;
  string action_type    = 2;
  string context_json   = 3;
  repeated string reasoning_steps = 4;
}

message ExplanationMessage {
  string explanation_id = 1;
  string action_id      = 2;
  string action_type    = 3;
  string explanation    = 4;
  repeated string reasoning_steps = 5;
  double confidence     = 6;
  double timestamp      = 7;
}

message ValidateExplanationRequest {
  string explanation_id   = 1;
  string explanation_text = 2;
  repeated string reasoning_steps = 3;
}

message ExplanationValidationMessage {
  string explanation_id = 1;
  string overall_result = 2;
  int32  rules_passed   = 3;
  int32  rules_failed   = 4;
  double average_score  = 5;
}

message GetExplanationRequest {
  string explanation_id = 1;
}

message ListExplanationsRequest {
  string action_type = 1;
  int32  limit       = 2;
}

message ExplanationList {
  repeated ExplanationMessage explanations = 1;
}

message ExplanationStats {
  int32  total          = 1;
  double avg_confidence = 2;
  double pass_rate      = 3;
}

// =====================================================================
// H4: Self Limitation Service
// =====================================================================

service SelfLimitationService {
  rpc RegisterPolicy(RegisterLimitPolicyRequest) returns (LimitPolicyMessage);
  rpc Check(CheckLimitRequest) returns (CheckLimitResponse);
  rpc RecordViolation(RecordViolationRequest) returns (ViolationMessage);
  rpc GetPolicy(GetLimitPolicyRequest) returns (LimitPolicyMessage);
  rpc ListPolicies(sylion.common.v1.Empty) returns (LimitPolicyList);
  rpc GetViolations(GetViolationsRequest) returns (ViolationList);
  rpc GetStats(sylion.common.v1.Empty) returns (LimitationStats);
}

message RegisterLimitPolicyRequest {
  string policy_id   = 1;
  string name        = 2;
  string constraint  = 3;
  double threshold   = 4;
  string action      = 5;  // warn|block|shutdown
}

message LimitPolicyMessage {
  string policy_id   = 1;
  string name        = 2;
  string constraint  = 3;
  double threshold   = 4;
  string action      = 5;
  bool   enabled     = 6;
}

message CheckLimitRequest {
  string action      = 1;
  string resource    = 2;
  string context_json = 3;
}

message CheckLimitResponse {
  bool   allowed  = 1;
  string policy_id = 2;
  string reason   = 3;
}

message RecordViolationRequest {
  string policy_id = 1;
  string action    = 2;
  string details_json = 3;
}

message ViolationMessage {
  string violation_id = 1;
  string policy_id    = 2;
  string action       = 3;
  string details_json = 4;
  double timestamp    = 5;
}

message GetLimitPolicyRequest {
  string policy_id = 1;
}

message LimitPolicyList {
  repeated LimitPolicyMessage policies = 1;
}

message GetViolationsRequest {
  string policy_id = 1;
  int32  limit     = 2;
}

message ViolationList {
  repeated ViolationMessage violations = 1;
}

message LimitationStats {
  int32 total_policies  = 1;
  int32 total_violations = 2;
  int32 blocks          = 3;
}

// =====================================================================
// H5: Self Preservation Service
// =====================================================================

service SelfPreservationService {
  rpc CheckHealth(sylion.common.v1.Empty) returns (HealthCheckResponse);
  rpc GetMode(sylion.common.v1.Empty) returns (ModeResponse);
  rpc SetMode(SetModeRequest) returns (sylion.common.v1.Status);
  rpc GetHealthScore(sylion.common.v1.Empty) returns (HealthScoreResponse);
  rpc GetChecks(sylion.common.v1.Empty) returns (HealthCheckList);
  rpc ShouldShutdown(sylion.common.v1.Empty) returns (ShutdownDecision);
  rpc GetStats(sylion.common.v1.Empty) returns (PreservationStats);
}

message HealthCheckResponse {
  bool   healthy  = 1;
  string status   = 2;
  repeated string issues = 3;
}

message ModeResponse {
  string mode = 1;  // normal|degraded|minimal|shutdown
}

message SetModeRequest {
  string mode = 1;
}

message HealthScoreResponse {
  double score = 1;  // 0.0 - 1.0
}

message HealthCheckList {
  repeated HealthCheckMessage checks = 1;
}

message HealthCheckMessage {
  string check_id = 1;
  string name     = 2;
  bool   passed   = 3;
  string message  = 4;
  double timestamp = 5;
}

message ShutdownDecision {
  bool   should_shutdown = 1;
  string reason          = 2;
}

message PreservationStats {
  double health_score    = 1;
  int32  checks_run      = 2;
  int32  mode_changes    = 3;
  int32  shutdown_triggers = 4;
}
