syntax = "proto3";

package sylion.aeis.advisor.actions.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service ActionsService {
  rpc HandleAction(HandleActionRequest) returns (HandleActionResponse);
  rpc RetryFailed(RetryFailedRequest) returns (RetryFailedResponse);
  rpc GetRoutingAudit(GetRoutingAuditRequest) returns (GetRoutingAuditResponse);
}

message HandleActionRequest {
  string card_id = 1;
  CardAction action = 2;
  string operator_id = 3;
  string operator_note = 4;
  string modified_recommendation = 5;
  string preference_key = 10;
  string preference_project_type = 11;
  string preference_project_domain = 12;
  google.protobuf.Value preference_value = 13;
  bool dont_learn_flag = 20;
}

enum CardAction {
  CARD_ACTION_UNSPECIFIED = 0;
  CARD_ACTION_ACCEPT = 1;
  CARD_ACTION_REJECT = 2;
  CARD_ACTION_MODIFY = 3;
  CARD_ACTION_REMIND_LATER = 4;
  CARD_ACTION_NOT_USEFUL = 5;
  CARD_ACTION_CONVERT_TO_HUMAN_GATE = 6;
  CARD_ACTION_CONVERT_TO_MASTERPLAN_CHANGE = 7;
  CARD_ACTION_SAVE_AS_PREFERENCE = 8;
  CARD_ACTION_DONT_LEARN_FROM_THIS = 9;
}

message HandleActionResponse {
  string action_event_id = 1;
  google.protobuf.Timestamp recorded_at = 2;
  bool soft_learning_triggered = 3;
  bool hard_learning_pending_confirmation = 4;
  string created_human_gate_ticket_id = 5;
  string created_masterplan_proposal_id = 6;
  string saved_preference_id = 7;
  string error_message = 8;
}

message RetryFailedRequest {
  string route_audit_id = 1;
}

message RetryFailedResponse {
  bool success = 1;
  string status = 2;
  string error_message = 3;
}

message GetRoutingAuditRequest {
  string card_id = 1;
}

message GetRoutingAuditResponse {
  repeated RouteAuditEntry entries = 1;
}

message RouteAuditEntry {
  string route_audit_id = 1;
  string card_id = 2;
  CardAction action = 3;
  string routed_to_module = 4;
  string routed_target_id = 5;
  google.protobuf.Value payload_sent = 6;
  google.protobuf.Value response = 7;
  string status = 8;
  string error_message = 9;
  google.protobuf.Timestamp routed_at = 10;
}
