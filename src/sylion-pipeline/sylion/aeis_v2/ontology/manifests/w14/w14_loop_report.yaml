api_version: sylion.aeis.v2/Object
kind: ObjectType
metadata:
  id: w14_loop_report
  name_pl: Raport pętli W14
  name_en: W14 Loop Report
  version: v1.0
  description_pl: 'Raport generowany przez Loop Governor po zatrzymaniu naprawy.

    W kolumnach trzymamy typ pętli, liczbę prób i podobieństwo,

    a diagnoza i decyzje pozostają w rozszerzeniu.'
  description_en: 'Report generated by the Loop Governor after repair is blocked.

    Columns keep the loop type, attempt count, and similarity score,

    while diagnosis and required decisions remain in the extension.'
  tags:
  - w14
  - testing
  - loop
  d_level: D2
spec:
  primary_key: id
  dedicated_columns:
  - name: legacy_w14_id
    type: text
    nullable: false
    indexed: true
    searchable: false
    unique: true
  - name: loop_type
    type: text
    nullable: false
    indexed: true
    searchable: false
    unique: false
    enum:
    - same_failure
    - no_progress
    - new_failures
    - test_modification
    - scope_drift
    - semantic_repeat
    default: same_failure
  - name: attempts_n
    type: integer
    nullable: false
    indexed: true
    searchable: false
    unique: false
    default: 0
  - name: similarity_score
    type: numeric
    nullable: false
    indexed: false
    searchable: false
    unique: false
    default: 0.0
  jsonb_extension:
    field: extension
    schema:
      type: object
      additionalProperties: true
  relations:
  - name: finding
    target: w14_finding
    cardinality: many_to_one
    on_delete: set_null
    nullable: false
  audit:
    enabled: true
    track_fields:
    - loop_type
    - attempts_n
    - similarity_score
    hash_chain: true
  search:
    enabled: true
    columns_to_index: []
  actions:
  - id: escalate_loop_report
    description_pl: Przekazuje raport pętli do decyzji człowieka lub councilu.
    description_en: Escalates the loop report to human or council decision.
    d_level: D3
    hg_required: true
    input_schema:
      type: object
      properties: {}
    effects:
    - type: emit_event
      topic: aeis.w14.loop_report.escalated
  - id: acknowledge_loop_report
    description_pl: Potwierdza odbiór raportu bez zmiany danych domenowych.
    description_en: Acknowledges receipt of the report without changing domain data.
    d_level: D2
    hg_required: false
    input_schema:
      type: object
      properties: {}
    effects:
    - type: emit_event
      topic: aeis.w14.loop_report.acknowledged
