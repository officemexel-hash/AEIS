api_version: sylion.aeis.v2/Object
kind: ObjectType
metadata:
  id: w14_human_decision_trace
  name_pl: Ślad decyzji ludzkiej W14
  name_en: W14 Human Decision Trace
  version: v1.0
  description_pl: 'Zapis działań, percepcji i metryk zachowania persony podczas symulacji.

    Najczęściej filtrowane są trace, simulation i relacje do persony,

    a bogaty zapis decyzji pozostaje w rozszerzeniu.'
  description_en: 'Record of actions, perception, and behavior metrics during simulation.

    Trace, simulation, and persona linkage are the main query fields,

    while the rich decision log remains in the extension.'
  tags:
  - w14
  - testing
  - decision_trace
  d_level: D2
spec:
  primary_key: id
  dedicated_columns:
  - name: legacy_w14_id
    type: text
    nullable: false
    indexed: true
    searchable: false
    unique: true
  - name: simulation_ref
    type: text
    nullable: false
    indexed: true
    searchable: false
    unique: false
  - name: decision_count
    type: integer
    nullable: false
    indexed: false
    searchable: false
    unique: false
    default: 0
  jsonb_extension:
    field: extension
    schema:
      type: object
      additionalProperties: true
  relations:
  - name: persona
    target: w14_human_persona
    cardinality: many_to_one
    on_delete: set_null
    nullable: false
  - name: scenario
    target: w14_human_scenario
    cardinality: many_to_one
    on_delete: set_null
    nullable: true
  audit:
    enabled: true
    track_fields:
    - simulation_ref
    - decision_count
    hash_chain: true
  search:
    enabled: true
    columns_to_index: []
  actions:
  - id: seal_human_decision_trace
    description_pl: Zamyka ślad decyzji do użycia jako dowód behawioralny.
    description_en: Seals the decision trace for use as behavioral evidence.
    d_level: D4
    hg_required: true
    input_schema:
      type: object
      properties: {}
    effects:
    - type: emit_event
      topic: aeis.w14.human_decision_trace.sealed
  - id: attach_human_decision_trace
    description_pl: Dołącza ślad do walidacji persony lub releasu.
    description_en: Attaches the trace to persona or release validation.
    d_level: D2
    hg_required: false
    input_schema:
      type: object
      properties: {}
    effects:
    - type: emit_event
      topic: aeis.w14.human_decision_trace.attached
