api_version: sylion.aeis.v2/Object
kind: ObjectType
metadata:
  id: inspection
  name_pl: Inspekcja
  name_en: Inspection
  version: v1.0
  description_pl: |
    Typ obiektu dla raportów inspekcyjnych pojazdów,
    z werdyktem, liczbą ustaleń i śladem zatwierdzeń.
    Wspiera działania wymagające Human Gate dla decyzji krytycznych.
  description_en: |
    Object type for vehicle inspection reports
    with verdicts, findings counts, and approval trail.
    Supports Human Gate for critical actions.
  tags: [inspection, report, compliance, w15]
  d_level: D2
spec:
  primary_key: id
  dedicated_columns:
    # NOTE: vehicle_id NIE jest dedicated column — generuje go relacja
    # `vehicle` poniżej jako FK column (compiler tworzy `vehicle_id UUID
    # REFERENCES sylion_v2.vehicle(id)`). Codex pomylił się dodając
    # zarówno relację jak i ten kolumn — clash łapany przez walidator.
    - name: inspector
      type: text
      nullable: false
      indexed: true
      searchable: true
    - name: inspected_at
      type: timestamptz
      nullable: false
      indexed: true
      searchable: false
    - name: findings_count
      type: integer
      nullable: false
      indexed: false
      searchable: false
      default: 0
    - name: verdict
      type: text
      nullable: false
      indexed: true
      searchable: false
      enum: [draft, passed, conditional, failed, void]
      default: draft
    - name: notes
      type: text
      nullable: true
      indexed: false
      searchable: true
  jsonb_extension:
    field: extension
    schema:
      type: object
      additionalProperties: true
      properties:
        findings:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              code:
                type: string
              severity:
                type: string
              title:
                type: string
              description:
                type: string
              resolved:
                type: boolean
  relations:
    - name: vehicle
      target: vehicle
      cardinality: many_to_one
      on_delete: restrict
  audit:
    enabled: true
    track_fields: ["vehicle_id", "inspector", "inspected_at", "verdict"]
    hash_chain: true
  search:
    enabled: true
    columns_to_index: ["inspector", "notes"]
    embeddings:
      enabled: false
      source_columns: ["notes"]
      dim: 1024
  actions:
    - id: submit_inspection
      description_pl: |
        Składa inspekcję jako formalny raport
        i wymaga zatwierdzenia przez Human Gate.
      description_en: |
        Submits the inspection as a formal report
        and requires Human Gate approval.
      d_level: D3
      hg_required: true
      input_schema:
        type: object
        properties:
          reason:
            type: string
        required: [reason]
      effects:
        - type: update_field
          field: verdict
          to: passed
        - type: emit_event
          topic: aeis.inspection.submitted
    - id: void_inspection
      description_pl: |
        Unieważnia raport inspekcyjny w sytuacji
        błędu proceduralnego lub cofnięcia decyzji.
      description_en: |
        Voids the inspection report in case
        of procedural error or decision rollback.
      d_level: D4
      hg_required: true
      input_schema:
        type: object
        properties:
          reason:
            type: string
        required: [reason]
      effects:
        - type: update_field
          field: verdict
          to: void
        - type: emit_event
          topic: aeis.inspection.voided
