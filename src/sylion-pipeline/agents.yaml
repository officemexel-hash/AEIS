  # === STAGE 6: DEPLOY ===
  pixel_deployer:
    enabled: true
    stage: 6
    role: "Deployer Pixel"
    model: claude
    priority: 7
    description: "ADB push/sideload na Pixel z GrapheneOS"
    params:
      device_serial: null    # Automatyczne wykrywanie
      grapheneos_ota: true
      adb_timeout: 120

    book_refs: ["KS-DEPLOY-PIXEL-*", "KS-SEC-DEPLOY-*"]
    allowed_actions: ["file_read", "file_write_result", "adb_push", "adb_shell_check", "http_health"]
    forbidden_actions: ["ssh_deploy", "go_build", "file_write"]
    requires_human_gate: true
    tier_scope: ["G1"]
    security_impact: critical
    produces_artifacts:
