    book_refs: ["KS-DEPLOY-ROUTER-*", "KS-SEC-DEPLOY-*"]
    allowed_actions: ["file_read", "file_write_result", "ssh_deploy", "ssh_check", "http_health"]
    forbidden_actions: ["adb_push", "go_build", "file_write"]
