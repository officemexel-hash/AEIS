  # === BOOK GUARDIAN (Stage 0 — Księga read-only protection) ===
  book_guardian:
    enabled: true
    stage: 0                 # Meta-agent — checks at every stage boundary
    role: "Strażnik Księgi (BookGuardian)"
    model: null              # No LLM needed — pure SHA-256 logic
    priority: 10
    description: >-
      Read-only protection for Księga SYLION 3.4 FIXED. Computes baseline
      SHA-256 at pipeline start, re-hashes at every stage boundary. On drift:
      CRITICAL escalation + pipeline HALT. NEVER modifies Księga.
    group: support
    book_refs: ["*"]         # Guards the entire Księga
    allowed_actions: ["file_read"]
    forbidden_actions: ["file_write", "file_write_result", "adb_push", "ssh_deploy"]
    requires_human_gate: false    # Auto-escalates on drift (CRITICAL)
    tier_scope: ["*"]
    security_impact: critical
    produces_artifacts:
      - baseline.json
      - drift_log.jsonl
      - audit_log.jsonl
    acceptance_tests:
      - "Drift detection on file modification"
      - "Drift detection on file deletion"
      - "CRITICAL escalation to Human Gate"
    params:
      auto_halt_on_drift: true
      watchdog_interval_sec: 3600    # Standalone watchdog mode interval

  # === BUDGET GUARD (Stage 0 — global daily cost cap) ===
  budget_guard:
    enabled: true
    stage: 0
    role: "Strażnik budżetu (BudgetGuard)"
    model: null
    priority: 10
    description: >-
      Global daily API cost cap. Records cost after each agent run, halts
      pipeline on budget exceeded. Warns at configurable threshold (default 80%).
      Persists daily state across restarts.
    group: support
    book_refs: []
    allowed_actions: ["file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy"]
    requires_human_gate: false    # Auto-escalates on exceed (CRITICAL)
    tier_scope: ["*"]
    security_impact: medium
    produces_artifacts:
      - budget_YYYY-MM-DD.json
    acceptance_tests:
      - "Budget exceeded halts pipeline"
      - "Warning at threshold"
      - "Persistence across restarts"
    params:
      max_cost_usd_per_day: 50.0
      warning_threshold: 0.80

  # === STAGE 9: REPORT ===
  reporter:
    enabled: true
    stage: 9
    role: "Reporter"
    model: claude-sonnet
    fallback_model: gpt-5
    priority: 8
    description: "Raport końcowy: audit_report.md, CHANGELOG, traceability matrix"
    learning: true
    multi_verify:
      enabled: true
      models: [gpt-5, gemini-pro]  # Weryfikacja raportu
    params:
      include_sdr: true
      include_security: true
      format: "markdown"
      generate_changelog: true
      generate_traceability: true
    book_refs: ["KS-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: medium
    produces_artifacts:
      - audit_report.md
      - changelog_fragment.md
      - traceability_update.json
    acceptance_tests:
      - "Report contains executive summary"
      - "Traceability matrix: Księga->Finding->Patch->Test"
      - "All CRITICAL findings listed"

  # === FILE VERIFIER (Stage 0 — anti-hallucination guard) ===
  file_verifier:
    enabled: true
    stage: 0                 # Meta-agent — works across all stages
    role: "Weryfikator plików (Anti-Hallucination Guard)"
    model: claude-sonnet
    priority: 9
    description: >-
      SHA-256 file verification layer. Snapshots declared files before each
      agent iteration, re-hashes after, detects hallucinated changes.
      Blocks agent on mismatch and escalates to Human Gate (CRITICAL).
    group: support
    params:
      fail_closed: true            # Block on hallucination (true) or warn only (false)
      auto_escalate: true          # Auto-escalate to Human Gate on CRITICAL
      verify_checksums: true       # Verify SHA-256 checksums
      max_files_per_snapshot: 500  # Max files in directory-wide snapshot
      monitored_extensions:        # File extensions to monitor in broad snapshots
        - ".go"
        - ".yaml"
        - ".yml"
        - ".json"
        - ".toml"
        - ".mod"
        - ".sum"
        - ".sh"
        - ".py"
    book_refs: ["KS-SEC-INTEGRITY-*"]
    allowed_actions: ["file_read", "file_verification"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["*"]
    security_impact: critical
    produces_artifacts:
      - file_verification_log.jsonl
    acceptance_tests:
      - "SHA-256 mismatch detected on file modification"
      - "CRITICAL escalation on hallucinated change"
      - "Audit log contains all verification events"

  # === SUPERVISOR (Stage 0 — meta-agent nadzorujący cały pipeline) ===
  supervisor:
    enabled: true
    stage: 0                 # Meta-agent — działa nad całym pipeline'em
    role: "Nadzorca (Supervisor)"
    model: claude-opus       # Najlepszy model do nadzoru i decyzji
    fallback_model: claude-sonnet
    priority: 10
    description: >-
      Nadzorca wszystkich agentów. Prowadzi checklistę, wymusza Human Gate
      przed każdą akcją, pilnuje Deterministic Runner (tylko pre-approved
      scenariusze). LLM NIGDY nie wydaje raw shell — generuje parametry
      do pre-approved scenariuszy. Musi pytać o zgodę.
    learning: true
    params:
      human_gate:
        enabled: true
        auto_approve_safe: false      # Nawet bezpieczne komendy wymagają zatwierdzenia
        timeout: 300                  # 5 min na odpowiedź administratora
        escalate_on_timeout: true     # Eskalacja jeśli brak odpowiedzi
        approval_log: "logs/human_gate.jsonl"  # Audit log zatwierdzeń
      safe_runner:
        enabled: true
        allow_raw_shell: false        # NIGDY raw shell bez zgody
        whitelisted_scenarios:
          - adb_push                  # ADB push binarek na Pixel
          - adb_shell_check           # ADB sprawdzenie statusu
          - ssh_deploy                # SSH/SCP deploy na router
          - ssh_check                 # SSH sprawdzenie statusu
          - go_build                  # go build z ograniczonymi flagami
          - go_test                   # go test
          - go_vet                    # go vet
          - hackrf_scan               # HackRF pasywne skanowanie
          - srsran_zmq                # srsRAN w trybie ZeroMQ (symulacja)
          - http_health               # HTTP health check
          - file_read                 # Odczyt plików (read-only)
          - file_write_result         # Zapis wyników do results/
          - git_status                # git status/log/diff (read-only)
          - file_verification         # SHA-256 file verification (read-only)
        blocked_patterns:             # Zawsze blokowane wzorce
          - "rm -rf /"
          - "dd if=/dev/"
          - "mkfs."
          - ":(){ :|:& };:"
          - "> /dev/sd"
          - "chmod -R 777"
          - "curl.*| bash"
          - "wget.*| sh"
      checklist:
        auto_generate: true           # Generuj checklistę po każdym podsumowaniu
        persist: true                 # Zapisz checklistę między sesjami
        checklist_path: "logs/checklist.json"
      loop_guard:
        max_iterations: 5              # Max iteracji na plik/finding
        similarity_threshold: 0.7      # Próg podobieństwa diff (0-1) — powyżej = pętla
        context_window_size: 50        # Rozmiar rolling window kontekstu
        snapshot_interval: 10          # Co ile operacji rób migawkę
        escalation_timeout: 120        # Timeout na decyzję przy pętli (sekundy)
        auto_switch_model: false       # Auto-przełączanie modelu przy pętli
      file_verification:
        enabled: true                  # SHA-256 anti-hallucination guard
        fail_closed: true              # Block agent on SHA mismatch
        auto_escalate: true            # Auto-escalate CRITICAL to Human Gate
        verify_checksums: true         # Verify file checksums before/after
      monitoring:
        watch_interval: 30            # Co 30s sprawdzaj status agentów
        alert_on_failure: true        # Alarmuj natychmiast przy błędach
        alert_on_timeout: true        # Alarmuj przy przekroczeniu timeout
        max_agent_runtime: 3600       # Max 1h per agent
    book_refs: ["KS-*"]
    allowed_actions: ["file_read", "file_write_result", "http_health", "git_status"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: true
    tier_scope: ["*"]
    security_impact: critical
    produces_artifacts:
      - supervisor_checklist.json
      - supervisor_summaries.json
      - human_gate.jsonl
    acceptance_tests:
      - "Checklist generated after each stage"
      - "Human Gate approval for every action"
      - "All escalations logged"

  # === SUPPORT AGENTS (Stage 0 — dostępni dla wszystkich) ===
  search_agent:
    enabled: true
    stage: 0                 # Wspomagający — wywoływany przez inne agenty
    role: "Wyszukiwarka online"
    model: perplexity-sonar-pro
    fallback_model: grok-3
    priority: 5
    description: "Równoległe wyszukiwanie: Perplexity + Grok (CVE, advisories, best practices)"
    group: support
    params:
      search_models: [perplexity-sonar-pro, grok-3, grok-3-mini]
      parallel: true           # Szukaj we wszystkich modelach równocześnie
      cache_results: true      # Cache wyników szukania
      cache_ttl: 3600          # 1h cache
      search_types:
        - cve_lookup           # Szukaj CVE dla znalezionych podatności
        - dependency_audit     # Sprawdź zależności
        - best_practices       # Aktualne best practices
        - threat_intel         # Najnowsze zagrożenia
        - sdr_documentation    # Dokumentacja srsRAN, gr-gsm, LimeSDR

    book_refs: []
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["*"]
    security_impact: low
    produces_artifacts:
      - search_cache.json
    acceptance_tests:
      - "CVE lookups return valid results"
      - "Results cached with TTL"
  reasoning_agent:
    enabled: true
    stage: 0                 # Wspomagający — głęboka analiza
    role: "Głęboki reasoning"
    model: o3                # OpenAI o3 — model rozumowania
    fallback_model: deepseek-r1
    priority: 5
    description: "Głęboka analiza logiczna dla złożonych problemów (o3 / DeepSeek R1)"
    group: support
    params:
      use_for:
        - complex_findings     # Skomplikowane findings wymagające głębokiego rozumowania
        - consensus_conflicts  # Sprzeczne opinie między modelami
        - architecture_review  # Przegląd architektury

# ---------------------------------------------------------------------------
# Predefiniowane profile (zestawy konfiguracji)
# ---------------------------------------------------------------------------
    book_refs: []
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["*"]
    security_impact: low
    produces_artifacts:
      - reasoning_analysis.json
    acceptance_tests:
      - "Analysis contains structured reasoning chain"
      - "Conclusion with confidence level"

  # ---------------------------------------------------------------------------
  # LOCAL MODEL AGENTS (Ollama)
  # ---------------------------------------------------------------------------

  # === OLLAMA LOCAL LEARNER ===
  ollama_local_learner:
    enabled: true
    stage: 0                     # Meta-agent, can run at any stage
    role: "Lokalny agent uczący się — Ollama"
    model: ollama-llama3
    fallback_model: claude-haiku # Cloud fallback if Ollama unavailable
    priority: 3
    description: >-
      Agent wykorzystujący lokalny model Ollama do nauki wzorców kodu,
      zapamiętywania false-positives, cache'owania powtarzalnych audytów
      i wstępnej filtracji finding'ów ZANIM trafią do modeli chmurowych.
      Zero kosztów API, pełna prywatność danych.
    learning: true
    params:
      # Learning configuration
      memory_backend: "local_json"       # Local JSON files (no cloud dependency)
      memory_file: "memory/ollama_learner.json"
      learning_rate: 0.8                 # How quickly it adapts to confirmed patterns
      confidence_threshold: 0.7          # Min confidence to auto-apply learned pattern
      max_learned_patterns: 5000

      # Pre-filter mode — runs before cloud models to reduce API cost
      pre_filter:
        enabled: true
        cache_ttl_hours: 72              # Cache pre-filter results for 72h
        auto_approve_trivial: true       # Auto-approve trivial findings (formatting, typos)
        auto_reject_known_fp: true       # Auto-reject known false positives

      # Human Gate integration
      human_gate:
        require_for_new_patterns: true   # Ask human to confirm new learned patterns
        require_for_contradictions: true # Ask human when local model contradicts cloud models
        auto_approve_safe: false         # Never auto-approve without human confirmation

      # Ollama-specific settings
      ollama:
        check_health_on_start: true      # Ping http://localhost:11434/api/tags on startup
        timeout_seconds: 120             # Longer timeout for local inference
        num_ctx: 8192                    # Intentionally low — full ctx (131k) requires ~16GB RAM
        temperature: 0.1                 # Low temperature for deterministic audit results
        fallback_to_cloud: true          # Fall back to cloud model if Ollama is down

    book_refs: ["KS-*"]
    allowed_actions:
      - file_read
      - memory_read
      - memory_write
    forbidden_actions:
      - adb_push
      - ssh_deploy
      - go_build
      - file_write_result          # Cannot write to pipeline results directly
    requires_human_gate: true      # Always confirm before acting on learned patterns
    tier_scope: ["G1", "G2"]
    security_impact: low           # Local-only, no external API calls
    produces_artifacts:
      - memory/ollama_learner.json
      - signals/local_pre_filter.json
    acceptance_tests:
      - "Ollama server responds to health check or graceful fallback"
      - "Pre-filter reduces cloud API calls by >20% on repeat audits"
      - "No false negatives — never filters out true critical findings"

