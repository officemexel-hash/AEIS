      - "Coverage >= 60% for critical packages"
  tester_integration:
    enabled: true
    stage: 7
    role: "Tester"
    model: gpt
    priority: 6
    description: "Testy integracyjne Pixel↔Router↔Server"
    group: testers

    book_refs: ["KS-TEST-*", "KS-DEPLOY-*"]
    allowed_actions: ["file_read", "file_write_result", "adb_shell_check", "ssh_check", "http_health"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1"]
    security_impact: medium
    produces_artifacts:
      - integration_results.json
    acceptance_tests:
