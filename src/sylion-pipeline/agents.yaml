      - "Failover and auto-reconnect verified"
  tester_e2e:
    enabled: true
    stage: 7
    role: "Tester"
    model: claude
    priority: 6
    description: "End-to-end: rejestracja → sesja → wiadomość → weryfikacja"
    group: testers

    book_refs: ["KS-TEST-*", "KS-SEC-*"]
    allowed_actions: ["file_read", "file_write_result", "adb_shell_check", "ssh_check", "http_health"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: medium
    produces_artifacts:
