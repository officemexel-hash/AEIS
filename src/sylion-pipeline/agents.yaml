  tester_regression:
    enabled: true
    stage: 7
    role: "Tester"
    model: gemini
    priority: 5
    description: "Porównanie z poprzednią wersją, benchmarki"
    group: testers
    book_refs: ["KS-TEST-*"]
    allowed_actions: ["file_read", "file_write_result", "go_test", "git_status"]
