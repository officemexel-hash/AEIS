# =============================================================================
# SYLION Agent Configuration — Panel zarządzania agentami
#
# Każdy agent może być:
#   enabled: true/false  — włączony/wyłączony
#   model: override      — nadpisanie domyślnego modelu
#   priority: 1-10       — priorytet (wyższy = ważniejszy)
#   params: {}           — parametry specyficzne dla agenta
#
# Użycie:
#   python agent_manager.py status          — pokaż status wszystkich agentów
#   python agent_manager.py enable <agent>  — włącz agenta
#   python agent_manager.py disable <agent> — wyłącz agenta
#   python agent_manager.py dashboard       — interaktywny panel
# =============================================================================

# ---------------------------------------------------------------------------
# Globalne ustawienia
# ---------------------------------------------------------------------------
global:
  # Próg konsensusu dla audytu (≥N/4 modeli = ACCEPT)
  consensus_threshold: 3

  # Domyślne modele per rola
  default_models:
    primary: claude-sonnet       # Główny model (Coordinator, Merger, Reporter)
    critical: claude-opus        # Krytyczne decyzje (Merger, final GO/NO-GO)
    fast: claude-haiku           # Szybkie zadania (walidacja, formatowanie)
    reasoning: o3                # Głęboka analiza (security, edge cases)
    search: perplexity-sonar-pro # Wyszukiwanie w sieci (CVE, advisories)
    audit:                       # Modele do audytu/weryfikacji (konsensus 3/5 = 60%)
      - claude-sonnet
      - gpt-5
      - gemini-pro
      - deepseek-v3
      - grok-3
      # NOTE: ollama-llama3 is NOT an auditor — it's a pre-filter only (Council Z5)
    local: ollama-llama3           # Domyślny lokalny model (Ollama, pre-filter only)

  # Multi-Model Verification
  verification:
    enabled: true              # Włącz weryfikację wyników przez wiele modeli
    min_agreement: 0.66        # Minimum zgodności (2/3)
    verify_count: 3            # Ile modeli weryfikuje każdy wynik
    verify_critical_only: false # Weryfikuj tylko krytyczne findings
    search_before_verify: true  # Szukaj w sieci przed weryfikacją
    search_models:              # Modele do wyszukiwania (równolegle)
      - perplexity-sonar-pro
      - grok-3

  # Agent Learning / Memory
  learning:
    enabled: true              # Agenci pamiętają wyniki między sesjami
    memory_dir: "memory/"      # Katalog z pamięcią agentów
    remember_false_positives: true   # Pamiętaj false positives
    remember_true_positives: true    # Pamiętaj potwierdzone findings
    remember_patterns: true          # Pamiętaj wzorce kodu
    max_memory_entries: 1000         # Limit wpisów per agent
    inject_memory_to_prompt: true    # Wstrzykuj pamięć do promptów

  # Tryby pipeline'u
  modes:
    dry_run: false           # Bez deploymentu i patchowania
    audit_only: false        # Tylko etapy 1-4 (bez patchy)
    skip_devices: false      # Pomiń deploy na urządzenia
    skip_sdr: false          # Pomiń testy SDR
    skip_security: false     # Pomiń Red/Blue Team

  # Timeout per agent (sekundy)
  default_timeout: 1800      # 30 min

  # Max równoległych agentów
  max_concurrency: 8

# ---------------------------------------------------------------------------
# STAGE 1: PREPARE
# ---------------------------------------------------------------------------
agents:
  # === COORDINATOR ===
  coordinator:
    enabled: true
    stage: 0                 # Meta-agent, działa przez cały pipeline
    role: "Orkiestrator pipeline'u"
    model: claude-opus       # Najlepszy model do krytycznych decyzji
    fallback_model: claude-sonnet
    priority: 10
    description: "Zarządza 30+ agentami, podejmuje decyzje GO/NO-GO"
    learning: true           # Pamięta wyniki poprzednich pipeline'ów
    params:
      retry_failed_stages: true
      max_retries: 2
    book_refs: ["KS-*"]
    allowed_actions: ["file_read", "file_write_result", "http_health"]
    forbidden_actions: ["adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: true
    tier_scope: ["G1", "G2", "VPS"]
    security_impact: critical
    produces_artifacts:
      - pipeline.log
      - signals/*.json
    acceptance_tests:
      - "All stages complete or explicitly skipped"
      - "GO/NO-GO decision recorded per stage"
      - "No unresolved CRITICAL findings"

  # === STAGE 1: PREPARE ===
  ksiega_analyst:
    enabled: true
    stage: 1
    role: "Analiza Księgi"
    model: claude-sonnet
    fallback_model: gpt-5
    priority: 9
    description: >-
      Parsuje Księgę 3.4, ekstrahuje wymagania bezpieczeństwa.
      Produkuje requirements.json — DERIVED ARTIFACT (artefakt pochodny).
      Źródło normatywne: Księga SYLION 3.4 FIXED (chroniona przez BookGuardian).
    learning: true
    multi_verify:
      enabled: true
      models: [gpt-5, gemini-pro]  # Weryfikuj wymagania przez 2 inne modele
    params:
      ksiega_path: null
      max_requirements: 500

    book_refs: ["KS-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["adb_push", "ssh_deploy", "go_build", "file_write"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - requirements.json
    acceptance_tests:
      - "requirements.json is valid JSON array"
      - "Each requirement has: id, category, priority, description, verification"
      - "At least 50 requirements extracted"
  build_agent:
    enabled: true
    stage: 1
    role: "Kompilacja binarek"
    model: claude-sonnet
    fallback_model: gpt-5
    priority: 8
    description: "go build: sylion-server, sylion-verify, sylionctl, sylion-relay"
    declared_files: []             # Build agent reads code, produces binaries — no source modifications
    params:
      targets:
        - { binary: "sylion-server",  arch: "amd64" }
        - { binary: "sylion-verify",  arch: "amd64" }
        - { binary: "sylionctl",      arch: "amd64" }
        - { binary: "sylion-relay",   arch: "amd64" }
        - { binary: "sylion-relay",   arch: "arm64" }
      run_tests: true
      run_vet: true
    book_refs: ["KS-BUILD-*", "KS-SEC-BINARY-*"]
    allowed_actions: ["file_read", "file_write_result", "go_build", "go_test", "go_vet"]
    forbidden_actions: ["adb_push", "ssh_deploy"]
    requires_human_gate: false
    tier_scope: ["G1"]
    security_impact: medium
    produces_artifacts:
      - build/amd64/sylion-server
      - build/amd64/sylion-verify
      - build/amd64/sylionctl
      - build/arm64/sylion-relay
      - build_status.json
    acceptance_tests:
      - "All binaries compile without errors"
      - "go vet passes"
      - "go test passes"
      - "Binary sizes within expected range"

  # === STAGE 2: AUDIT (×4) ===
  auditor_claude:
    enabled: true
    stage: 2
    role: "Audytor"
    model: claude-sonnet
    fallback_model: claude-opus
    priority: 8
    description: "Audyt bezpieczeństwa — Claude Sonnet 4"
    group: auditors
    learning: true
    multi_verify:
      enabled: true
      models: [gpt-5, gemini-pro, grok-3]  # Każdy finding weryfikowany przez 3 modele
    online_search:
      enabled: true          # Szukaj CVE/advisories dla findings
      models: [perplexity-sonar-pro, grok-3]
    params:
      strengths: "Logic flow, crypto implementation, auth patterns"
      focus_areas: ["auth", "crypto", "session"]

    book_refs: ["KS-SEC-*", "KS-AUTH-*", "KS-CRYPTO-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - audit_claude.json
    acceptance_tests:
      - "JSON array of findings with required fields"
      - "Each finding has file, line, severity, confidence"
      - "Confidence scores between 0.0-1.0"
  auditor_gpt:
    enabled: true
    stage: 2
    role: "Audytor"
    model: gpt-5
    fallback_model: gpt-4.1
    priority: 8
    description: "Audyt bezpieczeństwa — GPT-5"
    group: auditors
    learning: true
    multi_verify:
      enabled: true
      models: [claude-sonnet, gemini-pro, deepseek-v3]
    online_search:
      enabled: true
      models: [perplexity-sonar-pro, grok-3]
    params:
      strengths: "API security, input validation, injection patterns"
      focus_areas: ["api", "input_validation", "injection"]

    book_refs: ["KS-SEC-*", "KS-API-*", "KS-INPUT-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - audit_gpt.json
    acceptance_tests:
      - "JSON array of findings with required fields"
      - "Each finding has file, line, severity, confidence"
      - "Confidence scores between 0.0-1.0"
  auditor_gemini:
    enabled: true
    stage: 2
    role: "Audytor"
    model: gemini-pro
    fallback_model: gemini-flash
    priority: 8
    description: "Audyt bezpieczeństwa — Gemini 2.5 Pro"
    group: auditors
    learning: true
    multi_verify:
      enabled: true
      models: [claude-sonnet, gpt-5, grok-3]
    online_search:
      enabled: true
      models: [perplexity-sonar, grok-3-mini]
    params:
      strengths: "Concurrency, race conditions, resource management"
      focus_areas: ["concurrency", "race_conditions", "resources"]

    book_refs: ["KS-SEC-*", "KS-CONCURRENCY-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - audit_gemini.json
    acceptance_tests:
      - "JSON array of findings with required fields"
      - "Each finding has file, line, severity, confidence"
      - "Confidence scores between 0.0-1.0"
  auditor_deepseek:
    enabled: true
    stage: 2
    role: "Audytor"
    model: deepseek-v3
    fallback_model: deepseek-r1
    priority: 8
    description: "Audyt bezpieczeństwa — DeepSeek V3"
    group: auditors
    learning: true
    multi_verify:
      enabled: true
      models: [claude-sonnet, gpt-5, gemini-pro]
    params:
      strengths: "Memory safety, buffer handling, error paths"
      focus_areas: ["memory", "errors", "edge_cases"]

    book_refs: ["KS-SEC-*", "KS-MEMORY-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - audit_deepseek.json
    acceptance_tests:
      - "JSON array of findings with required fields"
      - "Each finding has file, line, severity, confidence"
      - "Confidence scores between 0.0-1.0"
  auditor_grok:
    enabled: true
    stage: 2
    role: "Audytor"
    model: grok-3
    fallback_model: grok-3-mini
    priority: 8
    description: "Audyt bezpieczeństwa — Grok 3 (z wyszukiwaniem)"
    group: auditors
    learning: true
    multi_verify:
      enabled: true
      models: [claude-sonnet, gpt-5, deepseek-v3]
    online_search:
      enabled: true
      models: [perplexity-sonar-pro]
    params:
      strengths: "Web-augmented analysis, CVE knowledge, real-time threat intel"
      focus_areas: ["known_vulns", "cve_matching", "supply_chain"]
    book_refs: ["KS-SEC-*", "KS-CVE-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - audit_grok.json
    acceptance_tests:
      - "JSON array of findings with required fields"
      - "Each finding has file, line, severity, confidence"
      - "CVE references validated where applicable"

  # === STAGE 3: CROSS-VERIFY (×4) ===
  verifier_claude:
    enabled: true
    stage: 3
    role: "Weryfikator krzyżowy"
    model: claude
    priority: 7
    description: "Weryfikuje findings z audytów GPT/Gemini/DeepSeek"
    group: verifiers

    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - verify_claude.json
    acceptance_tests:
      - "Each finding has verdict: CONFIRMED/DISPUTED/INCONCLUSIVE"
      - "Confidence and reasoning provided for each verdict"
  verifier_gpt:
    enabled: true
    stage: 3
    role: "Weryfikator krzyżowy"
    model: gpt
    priority: 7
    description: "Weryfikuje findings z audytów Claude/Gemini/DeepSeek"
    group: verifiers

    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
