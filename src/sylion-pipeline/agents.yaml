    stage: 5
    role: "Generator patchy"
    model: claude
    priority: 6
    description: "Patchuje findings partycja 3/4"
    group: patchers
    declared_files: []

    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write", "file_write_result", "go_build", "go_test", "go_vet"]
    forbidden_actions: ["adb_push", "ssh_deploy"]
    requires_human_gate: true
