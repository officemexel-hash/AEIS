      min_coverage: 60
      timeout: 600

    book_refs: ["KS-TEST-*"]
    allowed_actions: ["file_read", "file_write_result", "go_test"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy"]
    requires_human_gate: false
    tier_scope: ["G1"]
    security_impact: low
    produces_artifacts:
