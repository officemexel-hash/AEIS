    stage: 3
    role: "Weryfikator krzyżowy"
    model: deepseek
    priority: 7
    description: "Weryfikuje findings z audytów Claude/GPT/Gemini"
    group: verifiers
    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: false
    tier_scope: ["G1", "G2"]
    security_impact: high
    produces_artifacts:
      - verify_deepseek.json
    acceptance_tests:
      - "Each finding has verdict: CONFIRMED/DISPUTED/INCONCLUSIVE"
      - "Confidence and reasoning provided for each verdict"

  # === STAGE 4: MERGE ===
  merger:
    enabled: true
    stage: 4
    role: "Scalanie i decyzje"
    model: claude
    priority: 9
    description: "Deduplikuje findings, stosuje próg konsensusu, decyduje ACCEPT/REVIEW/SKIP"
    params:
      consensus_threshold: 3  # Nadpisuje globalne jeśli ustawione
    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write_result"]
    forbidden_actions: ["file_write", "adb_push", "ssh_deploy", "go_build"]
    requires_human_gate: true
    tier_scope: ["G1", "G2"]
    security_impact: critical
    produces_artifacts:
      - merged_findings.json
    acceptance_tests:
      - "Deduplicated findings with ACCEPT/REVIEW/SKIP decisions"
      - "Consensus counts per finding"
      - "No ACCEPT without >=3/4 agreement"

  # === STAGE 5: PATCH (×4) ===
  patcher_1:
    enabled: true
    stage: 5
    role: "Generator patchy"
    model: claude
    priority: 6
    description: "Patchuje findings partycja 1/4"
    group: patchers
    declared_files: []             # Populated dynamically from merged findings

    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write", "file_write_result", "go_build", "go_test", "go_vet"]
    forbidden_actions: ["adb_push", "ssh_deploy"]
    requires_human_gate: true
    tier_scope: ["G1"]
    security_impact: high
    produces_artifacts:
      - patches_1.json
    acceptance_tests:
      - "Each patch has unified diff + test"
      - "go vet passes after patch"
      - "go test passes after patch"
  patcher_2:
    enabled: true
    stage: 5
    role: "Generator patchy"
    model: claude
    priority: 6
    description: "Patchuje findings partycja 2/4"
    group: patchers
    declared_files: []

    book_refs: ["KS-SEC-*"]
    allowed_actions: ["file_read", "file_write", "file_write_result", "go_build", "go_test", "go_vet"]
    forbidden_actions: ["adb_push", "ssh_deploy"]
    requires_human_gate: true
    tier_scope: ["G1"]
    security_impact: high
