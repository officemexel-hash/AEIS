# Phase 3 W3.3 -- Tempo single-binary tracing backend.
#
# Receives OTLP gRPC on :4317 and OTLP HTTP on :4318.
# Sylion app is configured via SYLION_TRACING_ENDPOINT=http://tempo:4317.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h    # 7 days

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

usage_report:
  reporting_enabled: false
