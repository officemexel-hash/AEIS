[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sylion-aeis"
version = "3.5.0"
description = "Autonomous Engineering Intelligence System - 81 modules, 349+ endpoints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "SYLION" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "httpx",
    "websockets",
    "grpcio",
    "protobuf>=4.0",
]

[project.optional-dependencies]
dev = [
    "alembic",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
postgres = [
    "asyncpg",
    "psycopg[pool]>=3.1",
    "sqlalchemy[asyncio]",
]
advisor = [
    "psycopg[pool]>=3.1",
    "protobuf>=4.0",
    "grpcio",
    "grpcio-tools",
]
nats = [
    "nats-py",
]

[tool.hatch.build.targets.wheel]
packages = ["sylion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]
