[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = .
markers =
    requires_postgres: test requires running PostgreSQL (skip when only SQLite available; F-011)
    requires_grpc: test requires grpc package + grpc server running (F-010)
    integration: integration test that may take longer than 30s
    slow: test takes >10s (split out for fast CI lane)
