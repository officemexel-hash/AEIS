  # Contracts must NOT import from domain packages
  - from: [sylion.contracts]
    to: [sylion.governance, sylion.memory, sylion.cognitive, sylion.execution,
         sylion.security, sylion.efficiency, sylion.aeis, sylion.skills,
         sylion.surface, sylion.rebuild, sylion.quality, sylion.devices,
         sylion.sdr, sylion.cellular, sylion.api, sylion.db]
    allow: false
    comment: "Contracts must not directly import domain packages"

  # -------------------------------------------------------------------------
  # Core must NOT import from any domain package (it is the bottom layer)
  # -------------------------------------------------------------------------
  - from: [sylion.core]
    to: [sylion.governance, sylion.memory, sylion.cognitive, sylion.execution,
         sylion.security, sylion.efficiency, sylion.aeis, sylion.skills,
         sylion.surface, sylion.rebuild, sylion.quality, sylion.devices,
         sylion.sdr, sylion.cellular, sylion.api, sylion.db, sylion.contracts]
    allow: false
    comment: "Core is the bottom layer — must not import from domain packages"

  # -------------------------------------------------------------------------
  # No domain package may import from api (api is a consumer, not a provider)
  # -------------------------------------------------------------------------
  - from: [sylion.governance, sylion.memory, sylion.cognitive, sylion.execution,
           sylion.security, sylion.efficiency, sylion.aeis, sylion.skills,
           sylion.surface, sylion.rebuild, sylion.quality, sylion.devices,
           sylion.sdr, sylion.cellular, sylion.core, sylion.db, sylion.contracts]
    to: [sylion.api]
    allow: false
    comment: "API is a consumer facade — domain packages must not import from it"
