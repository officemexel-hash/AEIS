# SYLION v5.9.1 — Release Pipeline
#
# Trigger: push of a tag matching v* (e.g. v5.9.1, v6.0.0)
# Steps:
#   1. Build distributable ZIP archive
#   2. Build Docker image
#   3. Sign ZIP + Docker digest with cosign (keyless OIDC)
#   4. Upload ZIP + signatures to GitHub Releases

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # create GitHub Release
  packages: write        # push Docker image to GHCR
  id-token: write        # cosign keyless signing (OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Validate before release ───────────────────────────────────────────────
  pre-release-checks:
    name: Pre-release validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.in
          pip install pytest pytest-cov pyyaml

      - name: Run full test suite
        run: |
          pytest tests/ $(find . -maxdepth 1 -name "test_*.py" 2>/dev/null | tr '\n' ' ') \
            --cov=. \
            --cov-fail-under=75 \
            -v --tb=short

      - name: Validate agent manifest
        run: python scripts/validate_agents_manifest.py --strict

      - name: Verify VERSION matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE_VER="$(cat VERSION | tr -d '[:space:]')"
          if [ "${TAG}" != "v${FILE_VER}" ]; then
            echo "ERROR: tag ${TAG} does not match VERSION file (v${FILE_VER})"
            exit 1
          fi
          echo "Version check passed: ${TAG} == v${FILE_VER}"

  # ── 2. Build ZIP archive ─────────────────────────────────────────────────────
  build-zip:
    name: Build ZIP archive
    runs-on: ubuntu-latest
    needs: pre-release-checks
    timeout-minutes: 10
    outputs:
      zip_name: ${{ steps.pack.outputs.zip_name }}
      zip_sha256: ${{ steps.checksum.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack release archive
        id: pack
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="sylion-pipeline-${TAG}.zip"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

          zip -r "${ZIP_NAME}" . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "tests/__pycache__/*" \
            --exclude ".pytest_cache/*" \
            --exclude "*.egg-info/*" \
            --exclude "htmlcov/*" \
            --exclude ".coverage"

          echo "Built: ${ZIP_NAME} ($(du -sh ${ZIP_NAME} | cut -f1))"

      - name: SHA-256 checksum
        id: checksum
        run: |
          SHA=$(sha256sum "${{ steps.pack.outputs.zip_name }}" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "${SHA}  ${{ steps.pack.outputs.zip_name }}" >> CHECKSUMS.sha256
          cat CHECKSUMS.sha256

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            ${{ steps.pack.outputs.zip_name }}
            CHECKSUMS.sha256
          retention-days: 7

  # ── 3. Build & push Docker image ─────────────────────────────────────────────
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: pre-release-checks
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Sign artifacts with cosign ────────────────────────────────────────────
  sign:
    name: Sign with cosign (keyless)
    runs-on: ubuntu-latest
    needs: [build-zip, build-docker]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Sign ZIP archive
        run: |
          cosign sign-blob \
            --yes \
            --output-signature "${{ needs.build-zip.outputs.zip_name }}.sig" \
            "${{ needs.build-zip.outputs.zip_name }}"

      - name: Sign Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ needs.build-docker.outputs.image_digest }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Upload signature artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-signatures
          path: "*.sig"
          retention-days: 7

  # ── 5. Create GitHub Release ──────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-zip, build-docker, sign]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZIP + signatures
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES_FILE="docs/CHANGELOG_v${VER}.md"
          if [ -f "${NOTES_FILE}" ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "# ${TAG}" > release_notes_auto.md
            echo "" >> release_notes_auto.md
            echo "Docker image: \`ghcr.io/${{ github.repository }}:${VER}\`" >> release_notes_auto.md
            echo "SHA-256: \`${{ needs.build-zip.outputs.zip_sha256 }}\`" >> release_notes_auto.md
            echo "notes_file=release_notes_auto.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SYLION ${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            ${{ needs.build-zip.outputs.zip_name }}
            CHECKSUMS.sha256
            *.sig
