name: Security Audit — Daily pip-audit

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Run in strict mode (fail on any vulnerability)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  issues: write
  # Required to post audit results to PR (optional future use)
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'
  REQUIREMENTS_FILE: 'requirements-lock.txt'
  AUDIT_OUTPUT: 'pip-audit-results.json'

jobs:
  pip-audit:
    name: pip-audit — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pip-audit
        run: |
          pip install --upgrade pip
          pip install pip-audit==2.9.0

      - name: Run pip-audit (strict)
        id: audit
        run: |
          pip-audit \
            --strict \
            --requirement ${{ env.REQUIREMENTS_FILE }} \
            --format json \
            --output ${{ env.AUDIT_OUTPUT }} \
            --progress-spinner off \
            --no-deps \
            2>&1 | tee pip-audit-stdout.log
        continue-on-error: true

      - name: Parse audit result
        id: parse
        if: always()
        run: |
          if [ -f "${{ env.AUDIT_OUTPUT }}" ]; then
            VULN_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('${{ env.AUDIT_OUTPUT }}'))
          vulns = [v for dep in data.get('dependencies', []) for v in dep.get('vulns', [])]
          high_critical = [v for v in vulns if v.get('fix_versions')]
          print(len(vulns))
          " 2>/dev/null || echo "0")
            echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          else
            echo "vuln_count=unknown" >> $GITHUB_OUTPUT
          fi

          if [ ${{ steps.audit.outcome }} = 'success' ]; then
            echo "audit_status=clean" >> $GITHUB_OUTPUT
          else
            echo "audit_status=vulnerable" >> $GITHUB_OUTPUT
          fi

      - name: Upload audit results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results-${{ github.run_id }}
          path: |
            ${{ env.AUDIT_OUTPUT }}
            pip-audit-stdout.log
          retention-days: 90

      - name: Open GitHub issue on failure
        if: steps.parse.outputs.audit_status == 'vulnerable'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0];
            const vulnCount = '${{ steps.parse.outputs.vuln_count }}';

            // Check for existing open issue for today to avoid duplicates
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['security', 'pip-audit', 'automated'],
              per_page: 10
            });

            const existingToday = issues.data.find(i =>
              i.title.includes(`[pip-audit] Vulnerabilities detected`) &&
              i.title.includes(today)
            );

            if (existingToday) {
              console.log(`Issue already exists for today: #${existingToday.number}`);
              core.setOutput('issue_number', existingToday.number);
              return;
            }

            // Read audit output for details
            let auditSummary = 'See attached artifact for full details.';
            try {
              const stdout = fs.readFileSync('pip-audit-stdout.log', 'utf8');
              auditSummary = stdout.substring(0, 3000);
            } catch (e) {
              console.log('Could not read audit log:', e.message);
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pip-audit] Vulnerabilities detected — ${today} (${vulnCount} vulns)`,
              body: `## Security Audit Failure — Daily pip-audit

            **Date:** ${today}
            **Branch:** \`${{ github.ref_name }}\`
            **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Vulnerabilities found:** ${vulnCount}

            ### Audit Output
            \`\`\`
            ${auditSummary}
            \`\`\`

            ### Required Actions
            1. Review the [audit artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full JSON report.
            2. Update pinned versions in \`requirements-lock.txt\` for each vulnerable package.
            3. Follow the process in [docs/SECURITY_UPDATES.md](docs/SECURITY_UPDATES.md).
            4. Re-run this workflow after patching to confirm clean status.

            ### References
            - [pip-audit documentation](https://pypi.org/project/pip-audit/)
            - [SYLION Security Rotation Process](docs/SECURITY_UPDATES.md)

            /cc @security-team
            `,
              labels: ['security', 'pip-audit', 'automated', 'P0']
            });

            core.setOutput('issue_number', issue.data.number);
            console.log(`Created issue #${issue.data.number}`);

      - name: Send Slack alert on failure
        if: steps.parse.outputs.audit_status == 'vulnerable'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SLACK_SECURITY_CHANNEL || '#security-alerts' }}",
              "text": "🚨 pip-audit detected vulnerabilities in SYLION Pipeline",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 pip-audit Security Alert — SYLION Pipeline"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Vulnerabilities:*\n${{ steps.parse.outputs.vuln_count }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n`${{ github.ref_name }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Date:*\n${{ github.run_id }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\nScheduled cron (02:00 UTC)"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Issues"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/issues?q=label%3Apip-audit+is%3Aopen"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Follow the remediation process in <${{ github.server_url }}/${{ github.repository }}/blob/main/docs/SECURITY_UPDATES.md|docs/SECURITY_UPDATES.md>"
                    }
                  ]
                }
              ]
            }

      - name: Fail workflow if vulnerabilities found
        if: steps.parse.outputs.audit_status == 'vulnerable'
        run: |
          echo "::error::pip-audit detected ${{ steps.parse.outputs.vuln_count }} vulnerabilities. See issue and audit artifact for details."
          exit 1

      - name: Report clean status
        if: steps.parse.outputs.audit_status == 'clean'
        run: |
          echo "✓ pip-audit completed — no vulnerabilities detected"
          echo "Requirements file: ${{ env.REQUIREMENTS_FILE }}"
          echo "Python version: ${{ env.PYTHON_VERSION }}"
