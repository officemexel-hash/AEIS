; SYLION runtime SQLite schema capture.
;
; The authoritative migration chain for the local sylion_aeis.db runtime
; lives under migrations_alembic/. Existing imperative bootstrap code
; remains in place for backward compatibility, but new schema changes
; should land here first.

[alembic]
script_location = migrations_alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///sylion_aeis.db

; Override at runtime:
;   ALEMBIC_DATABASE_URL=sqlite:///C:/absolute/path/to/sylion_aeis.db
;   alembic upgrade head

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
